<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | default: site.title | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} | {% elsif page.name %}{{ page.name | escape }} | {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  </head>
  <body>
    {% include site-header.html %}
    <main class="page-content">
      {{ content }}
    </main>
  </body>
</html>
