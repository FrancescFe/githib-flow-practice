---
layout: default
---
<article class="content-card" aria-labelledby="page-title">
  <h1 id="page-title">{{ page.name | escape }}</h1>
  {% if page.github_username %}
    <p><strong>GitHub:</strong> <a href="https://github.com/{{ page.github_username | escape }}">{{ page.github_username | escape }}</a></p>
  {% endif %}
  {% if page.course %}
    <p><strong>Course:</strong> {{ page.course | escape }}</p>
  {% endif %}
  {{ content }}
</article>
