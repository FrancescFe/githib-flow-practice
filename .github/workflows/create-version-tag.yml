name: Create version tag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-tag:
    name: Create tag from VERSION
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main; selected ref was $GITHUB_REF." >&2
            exit 1
          fi

          VERSION="$(< VERSION)"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must use the x.y.z format, for example 0.1.0; found '$VERSION'." >&2
            exit 1
          fi

          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --message "Release $TAG" "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

          echo "Created tag $TAG for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
